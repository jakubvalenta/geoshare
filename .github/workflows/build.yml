name: build
on:
  pull_request:
    branches:
      - 'main'
      - 'devel'
  push:
    branches:
      - 'main'
      - 'devel'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run lint for the free debug variant
        run: ./gradlew lintFreeActiveDebug

      - name: Run lint for the pro debug variant
        run: ./gradlew lintProActiveDebug

      - name: Run unit tests for the free debug variant
        run: ./gradlew testFreeActiveDebugUnitTest

      - name: Run unit tests for the pro debug variant
        run: ./gradlew testProActiveDebugUnitTest

      - name: Build the free debug variant
        run: ./gradlew assembleFreeActiveDebug

      - name: Build the pro debug variant
        run: ./gradlew assembleProActiveDebug

      - name: Upload free debug APK
        uses: actions/upload-artifact@v7
        with:
          name: free-debug-apk
          path: app/build/outputs/apk/freeActive/debug/app-free-active-debug.apk
